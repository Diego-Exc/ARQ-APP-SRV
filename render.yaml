databases:
  - name: arreglapues-db
    plan: free
    databaseName: arreglapues
    user: arreglapues

services:
  - type: web
    name: arreglapues-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: arreglapues-db
          property: connectionString
